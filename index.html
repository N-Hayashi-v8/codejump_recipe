<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="recipe diary">
  <title>Recipe Diary</title>
  <link rel="icon" href="img/favicon.ico">
  <link rel="stylesheet" href="css/destyle.css">

<body>
  <main class="main">
    <div class="main-visual">
      <img src="images/mainvisual.jpg" alt="Assorted breakfast dishes on a table">

      <p class="intro__text">

    <section class="gallery">

        <a href="recipe1.html">

    <div class="button-area">
      <a class="button" href="#">レシピ一覧を見る</a>
    </div>

  </main>

  <footer class="footer">
    <ul class="footer__sns">
      <li class="footer__item"><a href="#">Instagram</a></li>
      <li class="footer__item"><a href="#">Twitter</a></li>
      <li class="footer__item"><a href="#">Facebook</a></li>
